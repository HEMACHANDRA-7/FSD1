services:
  # 1. Products File Persistence
  - type: web
    name: fsd-file-persistent-app
    runtime: node
    plan: free
    rootDir: File-persistent-app
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000

  # 2. Non-Persistent App
  - type: web
    name: fsd-non-persistent-app
    runtime: node
    plan: free
    rootDir: Non-persistent-app
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000

  # 3. Express Middleware API
  - type: web
    name: fsd-express-middleware-api
    runtime: node
    plan: free
    rootDir: express_middleware_api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000

  # 4. MongoDB Express
  - type: web
    name: fsd-mongodb-express-app
    runtime: node
    plan: free
    rootDir: mongodb-express-app
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URL
        value: mongodb+srv://deepikaarugalla_db_user:CTwGuWP9yQWmDb3p@cluster0.wvbmzxj.mongodb.net
      - key: DB_NAME
        value: booksDB

  # 5. MongoDB Mongoose Movies
  - type: web
    name: fsd-mongoose-express-app
    runtime: node
    plan: free
    rootDir: mongoose_express_app
    buildCommand: npm install
