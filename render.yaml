      - key: PORT
        value: 10000
      - key: MONGO_URL
        value: mongodb+srv://deepikaarugalla_db_user:CTwGuWP9yQWmDb3p@cluster0.wvbmzxj.mongodb.net
      - key: DB_NAME
        value: movieDB

  # 6. MVC Auth
  - type: web
    name: fsd-mvc-auth-app
    runtime: node
    plan: free
    rootDir: mvc_auth_app
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URL
        value: mongodb+srv://deepikaarugalla_db_user:CTwGuWP9yQWmDb3p@cluster0.wvbmzxj.mongodb.net
      - key: DB_NAME
        value: authDB
      - key: JWT_SECRET
        value: default_jwt_secret_dev_key_12345

  # 7. MVC Express
  - type: web
    name: fsd-mvc-express-app
